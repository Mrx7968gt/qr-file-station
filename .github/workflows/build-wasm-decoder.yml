name: Build WASM Decoder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wasm-decoder.yml'

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout libcimbar
        uses: actions/checkout@v4
        with:
          repository: sz3/libcimbar
          ref: master
          path: libcimbar

      - name: Build in Docker (emscripten)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/libcimbar:/usr/src/app" \
            emscripten/emsdk:3.1.39 \
            bash -c '
              set -e
              cd /usr/src/app
              apt-get update -qq && apt-get install -y -qq python3 > /dev/null 2>&1
              
              git clone --depth 1 --branch 4.9.0 https://github.com/opencv/opencv.git opencv4
              cd opencv4
              mkdir -p opencv-build-wasm && cd opencv-build-wasm
              python3 ../platforms/js/build_js.py build_wasm \
                --build_wasm \
                --emscripten_dir /emsdk/upstream/emscripten \
                --build_test=no
              
              cd /usr/src/app
              source /emsdk/emsdk_env.sh
              mkdir -p build-wasm && cd build-wasm
              emcmake cmake .. -DUSE_WASM=1 -DOPENCV_DIR=/usr/src/app/opencv4
              make -j$(nproc) cimbar_js
              make install
            '

      - name: Collect output
        run: |
          mkdir -p wasm-output
          find libcimbar -name "cimbar_js.js" -exec cp {} wasm-output/ \;
          find libcimbar -name "cimbar_js.wasm" -exec cp {} wasm-output/ \;
          cp libcimbar/web/recv-worker.js wasm-output/ 2>/dev/null || true
          cp libcimbar/web/recv.js wasm-output/ 2>/dev/null || true
          cp libcimbar/web/zstd.js wasm-output/ 2>/dev/null || true
          ls -lh wasm-output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cimbar-wasm-decoder
          path: wasm-output/
          if-no-files-found: error
          retention-days: 90
